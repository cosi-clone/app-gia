<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — Excel Reader</title><link rel="stylesheet" href="auth.css"><script type="module" src="login.js"></script></head><body class="account-page"><main class="account-shell"><div class="account-brand"><div class="account-mark">X</div><strong>Excel Reader</strong></div><section class="account-card"><div class="account-tabs"><button id="tab-login" class="active">Đăng nhập</button><button id="tab-register">Đăng ký</button></div><h1 id="auth-title">Chào mừng trở lại</h1><p class="muted">Đăng nhập để sử dụng template Excel của bạn.</p><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><label id="confirm-label" hidden>Nhập lại mật khẩu<input id="confirm-password" type="password" autocomplete="new-password"></label><button id="submit-auth" class="full" type="submit" disabled>Đăng nhập</button></form><div class="actions"><button id="forgot-password" class="text-button">Quên mật khẩu?</button></div><button id="google-login" class="full secondary" hidden>Tiếp tục với Google</button><p class="muted">Tài khoản mới cần mã kích hoạt do Tài khoản mới cần mã kích hoạt do <a href="https://www.facebook.com/cossiii.py" target="_blank" rel="noopener noreferrer" style="color: #107c41; text-decoration: underline;">admin</a>cấp.</p><p id="auth-message" class="account-message" role="status"></p></section></main></body></html>
